name: Build NVENC Old Kepler (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build plugin
        shell: pwsh
        env:
          CI: true
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin
        shell: pwsh
        env:
          CI: true
        run: .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvenc-old-kepler-windows-x64
          path: release/nvenc-old-kepler-*-windows-x64.zip
          if-no-files-found: error
